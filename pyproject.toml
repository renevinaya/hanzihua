[project]
name = "hanzihua"
version = "0.1.2"
description = "A picture frame with an ePaper display showing a Chinese word per day"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "dragonmapper",
    "pillow",
    "requests",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs",
    "mypy",
    "pylint",
    "types-requests",
]
display = [
    "gpiozero",
    "spidev",
]

[tool.uv]
# idna is a transitive dependency (via requests). Versions < 3.15 are affected
# by CVE-2026-45409, so enforce a secure floor without making it a direct dep.
constraint-dependencies = [
    "idna>=3.15",
]
